services:
  sc-audio:
    build:
      context: ../..
      dockerfile: containers/sc-development/Dockerfile
    image: sc-adat-sc-development:debian13
    container_name: sc-adat-sc-audio
    init: true
    network_mode: host
    ipc: shareable
    shm_size: 256m
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - "${AUDIO_GID:-29}"
    cap_add:
      - IPC_LOCK
      - SYS_NICE
    ulimits:
      rtprio: 95
      memlock: -1
    environment:
      JACK_NO_AUDIO_RESERVATION: "1"
      QT_QPA_PLATFORM: "offscreen"
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      # Realtime is the verified default. Set JACK_REALTIME=0 for a deliberate
      # non-realtime diagnostic run without changing the Compose file.
      JACK_REALTIME: "${JACK_REALTIME:-1}"
    stop_grace_period: 5s
    volumes:
      - ../../supercollider:/workspace/supercollider:ro
      - ../../payload:/workspace/payload:ro
      - ../../scripts:/workspace/scripts:ro
      - ../../mixer:/workspace/mixer:ro
      - ../../.local/payload-build:/payload-out
      - ../../.local/sc-audio-logs:/var/log
  sc-mixer:
    image: sc-adat-sc-development:debian13
    container_name: sc-adat-sc-mixer
    init: true
    network_mode: host
    ipc: service:sc-audio
    depends_on:
      - sc-audio
    entrypoint: ["sh", "-c"]
    command: ["set -eu; ready=0; for retry in $$(seq 1 100); do if SC_ADAT_OSC_PORT=57110 /usr/bin/sc-adat-osc-loader sync >/dev/null 2>&1; then ready=1; break; fi; sleep 0.1; done; test \"$$ready\" -eq 1; SC_ADAT_OSC_PORT=57110 /usr/bin/sc-adat-osc-loader load /payload-out/synthdefs/sc_adat_mixer.scsyndef; SC_ADAT_OSC_PORT=57110 /usr/bin/sc-adat-osc-loader sync; for retry in $$(seq 1 100); do jack_lsp system:capture_16 system:playback_16 jack:in_16 jack:out_16 >/dev/null 2>&1 && break; sleep 0.1; done; jack_lsp system:capture_16 system:playback_16 jack:in_16 jack:out_16 >/dev/null; for i in $$(seq 1 16); do for retry in $$(seq 1 20); do jack_connect system:capture_$$i jack:in_$$i && break; sleep 0.1; done; for retry in $$(seq 1 20); do jack_connect jack:out_$$i system:playback_$$i && break; sleep 0.1; done; done; exec python3 /workspace/mixer/mixerctl.py serve /workspace/payload/config/mixer.conf"]
    volumes:
      - ../../mixer:/workspace/mixer:ro
      - ../../payload:/workspace/payload:ro
      - ../../.local/payload-build:/payload-out:ro
