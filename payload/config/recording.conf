# Production: replace with the dedicated ext4 SSD filesystem UUID.
# Blank is intentionally safe: recording start returns NO_RECORDING_DISK.
recording.mount=/recordings
recording.uuid=
recording.filesystem=ext4
recording.segment_seconds=900
recording.emergency_reserve_bytes=5368709120
recording.ready_seconds=7200
recording.capture_prefix=system:capture_
recording.master_prefix=jack:out_
recording.jack_connect=/usr/bin/jack_connect
recording.executable=/usr/bin/sc-adat-recorder
recording.midi_port=
recording.arecordmidi=/usr/bin/arecordmidi
